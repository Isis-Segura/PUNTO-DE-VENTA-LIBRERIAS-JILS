services:
  db:
    image: mysql:8.4
    container_name: libreria_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sisgestiondeinventario
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 4s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: libreria_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: libreria_app
    restart: unless-stopped
    ports:
      - "8000:10000"
    environment:
      PORT: 10000
      APP_NAME: "Libreria JILS"
      APP_ENV: local
      APP_KEY: "base64:ZCfA8UBM/wN1fdmXsgRa9Hf9aqxCMY/2DpCCTZpjBXw="
      APP_DEBUG: "true"
      APP_URL: "http://localhost:8000"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: sisgestiondeinventario
      DB_USERNAME: root
      DB_PASSWORD: root
      ADMIN_SEED_NAME: "Administrador General"
      ADMIN_SEED_EMAIL: "admin@pi.com"
      ADMIN_SEED_PASSWORD: "admin1234"
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      # Correo: los valores se leen del archivo .env (junto a este docker-compose.yml).
      # Si no se definen, el correo solo se escribe en storage/logs/laravel.log (no se envía).
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
      MAIL_FROM_NAME: "Libreria JILS"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
